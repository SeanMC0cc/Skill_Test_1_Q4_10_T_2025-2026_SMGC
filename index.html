<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Bootstrap -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <!-- CSS -->
        <link rel="stylesheet" href="style.css">
        <!-- PyScript -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
        <title>Skills Test</title>
        <py-config>
            packages = ["numpy", "matplotlib"]
        </py-config>
    </head>
    <body>
        <form >
            <input type="number" id="Absent" placeholder="Absent people for the month"><br>
            <select name="Months" id="Months">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select><br>

            <input type="button" py-click="Calculate" value="Generate Graph" id="Calculate">
        </form>
        <div id="output"></div>
        <py-script src="main.py"></py-script>
        <!--<script type="py" src="main.py" config='{"packages":["numpy","matplotlib"]}'></script>-->
    </body>
</html>
